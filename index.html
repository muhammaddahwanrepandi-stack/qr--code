<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: Arial, sans-serif;
      color: white;
    }

    .box {
      width: 90%;
      max-width: 400px;
      text-align: center;
      padding: 30px 20px;
      background: #1f2937;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #d1d5db;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 15px 0;
      box-sizing: border-box;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #qrcode {
      margin: 25px auto 0;
      background: white;
      padding: 15px;
      width: fit-content;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>💖 QR Code</h1>
    <p>Masukkan link atau tulisan yang ingin dijadikan QR Code.</p>

    <input
      id="text"
      type="text"
      placeholder="Masukkan link di sini..."
    >

    <br>

    <button onclick="buatQR()">Buat QR Code</button>

    <div id="qrcode"></div>
  </div>

  <script>
    function buatQR() {
      const text = document.getElementById("text").value;
      const qr = document.getElementById("qrcode");

      qr.innerHTML = "";

      if (text.trim() === "") {
        alert("Masukkan link atau tulisan terlebih dahulu!");
        return;
      }

      new QRCode(qr, {
        text: text,
        width: 220,
        height: 220
      });
    }
  </script>

</body>
</html>
